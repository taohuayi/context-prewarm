name: Publish GPTQuotaPrewarm v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.2.0.yml'

permissions:
  contents: write

concurrency:
  group: gpt-quota-prewarm-v0.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'taohuayi/context-prewarm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate renamed skill
        run: |
          python tools/validate_skill.py
          python -m unittest discover -s tests -v
      - name: Create v0.2.0 release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          awk '/^---$/{exit} {print}' CHANGELOG.md > /tmp/RELEASE_NOTES.md
          gh release create v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GPTQuotaPrewarm v0.2.0" \
            --notes-file /tmp/RELEASE_NOTES.md
