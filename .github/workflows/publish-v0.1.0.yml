name: Publish v0.1.0

# Runs once when this release workflow is first committed.
# Changes to unrelated files do not trigger it. No recurring auto-release.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.0.yml'

permissions:
  contents: write

concurrency:
  group: context-prewarm-release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'taohuayi/context-prewarm'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
      - name: Publish exactly one release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; nothing to do.'
            exit 0
          fi
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Context Prewarm v0.1.0' \
            --notes-file CHANGELOG.md
